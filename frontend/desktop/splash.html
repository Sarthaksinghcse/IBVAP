<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SHIELD — Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash {
      width: 440px;
      height: 340px;
      background: linear-gradient(145deg, #0a0e1a 0%, #0d152c 40%, #080c18 100%);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      box-shadow:
        0 0 60px rgba(59, 130, 246, 0.2),
        0 25px 50px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Animated glow border */
    .splash::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 21px;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(59, 130, 246, 0.5) 10%,
        transparent 20%,
        transparent 50%,
        rgba(14, 165, 233, 0.4) 60%,
        transparent 70%
      );
      animation: borderRotate 4s linear infinite;
      z-index: -1;
    }

    @keyframes borderRotate {
      to { transform: rotate(360deg); }
    }

    /* Shield logo */
    .logo-wrap {
      width: 84px;
      height: 84px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.5));
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4)); }
      50% { transform: scale(1.04); opacity: 0.95; filter: drop-shadow(0 0 30px rgba(14, 165, 233, 0.7)); }
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 7px;
      color: #f8fafc;
      text-shadow: 0 0 35px rgba(59, 130, 246, 0.6);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .subtitle {
      font-size: 11px;
      color: rgba(148, 163, 184, 0.85);
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin-top: -12px;
      font-weight: 500;
    }

    /* Loading bar */
    .loader-container {
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loader-track {
      width: 100%;
      height: 3px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #0ea5e9, #3b82f6);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { transform: translateX(350%); background-position: 0% 50%; }
    }

    .status {
      font-size: 12px;
      color: rgba(148, 163, 184, 0.75);
      letter-spacing: 0.5px;
    }

    .status span {
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Version badge */
    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: rgba(100, 116, 139, 0.6);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <img src="logo.png" alt="SHIELD Logo" class="logo-img" />
    </div>

    <div class="title">SHIELD</div>
    <div class="subtitle">Intelligent Border Surveillance</div>

    <div class="loader-container">
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
      <div class="status">Initializing AI Defense Systems<span>...</span></div>
    </div>

    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
