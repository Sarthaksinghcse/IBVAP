<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IBVAP — Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash {
      width: 440px;
      height: 320px;
      background: linear-gradient(145deg, #0d1224 0%, #111a3a 40%, #0f1629 100%);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      box-shadow:
        0 0 60px rgba(59, 130, 246, 0.15),
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* Animated glow border */
    .splash::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 21px;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(59, 130, 246, 0.4) 10%,
        transparent 20%,
        transparent 50%,
        rgba(139, 92, 246, 0.3) 60%,
        transparent 70%
      );
      animation: borderRotate 4s linear infinite;
      z-index: -1;
    }

    @keyframes borderRotate {
      to { transform: rotate(360deg); }
    }

    /* Shield icon */
    .logo {
      width: 72px;
      height: 72px;
      position: relative;
    }

    .shield {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #f0f4ff;
      text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
    }

    .subtitle {
      font-size: 11px;
      color: rgba(148, 163, 184, 0.8);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -12px;
    }

    /* Loading bar */
    .loader-container {
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loader-track {
      width: 100%;
      height: 3px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { transform: translateX(350%); background-position: 0% 50%; }
    }

    .status {
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.5px;
    }

    .status span {
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Version badge */
    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: rgba(100, 116, 139, 0.5);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg class="shield" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shield shape -->
        <path d="M36 6L10 18V34C10 50.5 21 61.5 36 66C51 61.5 62 50.5 62 34V18L36 6Z"
              fill="url(#shieldGrad)" stroke="rgba(59,130,246,0.6)" stroke-width="1.5"/>
        <!-- Eye/scan icon inside -->
        <ellipse cx="36" cy="35" rx="12" ry="8" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
        <circle cx="36" cy="35" r="4" fill="#60a5fa"/>
        <!-- Scan lines -->
        <line x1="24" y1="28" x2="48" y2="28" stroke="rgba(96,165,250,0.3)" stroke-width="0.5"/>
        <line x1="24" y1="42" x2="48" y2="42" stroke="rgba(96,165,250,0.3)" stroke-width="0.5"/>
        <defs>
          <linearGradient id="shieldGrad" x1="36" y1="6" x2="36" y2="66">
            <stop offset="0%" stop-color="rgba(59,130,246,0.15)"/>
            <stop offset="100%" stop-color="rgba(139,92,246,0.1)"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="title">IBVAP</div>
    <div class="subtitle">Border Video Analytics Platform</div>

    <div class="loader-container">
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
      <div class="status">Starting AI Engine<span>...</span></div>
    </div>

    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
